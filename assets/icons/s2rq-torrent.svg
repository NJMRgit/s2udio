<?xml version="1.0" encoding="UTF-8"?>
<!-- s2udio rqbit tray/launcher icon (round 81 follow-up): a monochrome
     torrent glyph — a ring with an up and a down arrow. The colour is the
     light variant on purpose: it is drawn on dark panels/menus, where
     breeze's light-scheme `torrents-symbolic` (#232629) was nearly
     invisible. `fill:currentColor` + the ColorScheme-Text class keep it
     recolourable by hosts that map symbolic icons onto their palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <defs>
    <style type="text/css">
      .ColorScheme-Text { color: #fcfcfc; }
    </style>
  </defs>
  <g class="ColorScheme-Text" style="fill:currentColor;stroke:currentColor">
    <circle cx="11" cy="11" r="8.4" fill="none" stroke-width="1.5"/>
    <path d="M 11 5.6 L 13.5 8.3 L 11.9 8.3 L 11.9 10.6 L 10.1 10.6 L 10.1 8.3 L 8.5 8.3 Z" stroke="none"/>
    <path d="M 11 16.4 L 8.5 13.7 L 10.1 13.7 L 10.1 11.4 L 11.9 11.4 L 11.9 13.7 L 13.5 13.7 Z" stroke="none"/>
  </g>
</svg>
